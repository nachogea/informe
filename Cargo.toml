[package]
name = "informe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Native GPUI viewer for agent-generated semantic artifacts"
repository = "https://github.com/nachogea/informe"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
markdown = "=1.0.0"
sha2 = "=0.10.9"
gpui-base = "=0.7.0"
resvg = "=0.46.0"
rustybuzz = "=0.20.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }

[[example]]
name = "render-icon"
path = "tools/render-icon.rs"
